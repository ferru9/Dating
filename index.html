<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4038d9" />
    <meta name="description" content="Pregunta seria." />
    <title>pregunta seria</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="question-card" aria-labelledby="question">
        <img class="cat-sticker cat-sad" src="assets/sad-cat.png" alt="" aria-hidden="true" />

        <p class="serious-pill">pregunta seria</p>
        <h1 id="question">¿Irías a una cita conmigo?</h1>
        <p class="choice-label">sí o no</p>

        <div class="choice-area" id="choice-area">
          <button class="choice-button no-button" id="no-button" type="button">No</button>
          <button class="choice-button yes-button" id="yes-button" type="button">Sí <span>↗</span></button>
        </div>

        <p class="situation-pill">es una situación de sí o sí xd</p>
        <p class="feedback" id="feedback" role="status" aria-live="polite">ok ya, di que sí 🥰</p>

        <img class="cat-sticker cat-happy" src="assets/thumbs-up-cat.png" alt="" aria-hidden="true" />
      </section>
    </main>
  </body>
</html>
